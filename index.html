<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Leader · Seguimiento</title>
<script>try{var __t=localStorage.getItem("ml_theme");if(__t)document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="center"><div class="card"><p id="boot-msg">Cargando…</p></div></div>

<div id="login" class="center" hidden>
  <form id="login-form" class="card" autocomplete="on">
    <p class="eyebrow">MARKET LEADER · SEGUROS</p>
    <h1>Acceso</h1>
    <label>Correo<input id="login-email" type="email" required autocomplete="username"></label>
    <label>Contraseña<input id="login-pass" type="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn primary">Entrar</button>
    <p id="login-msg" class="msg" role="alert"></p>
  </form>
</div>

<div id="config-error" class="center" hidden>
  <div class="card"><h1>Falta la configuración</h1>
  <p>Edita <code>config.js</code> con la URL y la clave anónima de tu proyecto de Supabase (ver README).</p></div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="eyebrow">MARKET LEADER · SEGUROS</span><strong>Seguimiento</strong></div>
    <nav class="tabs" id="tabs">
      <button data-tab="dashboard" class="active">Cuadro de mando</button>
      <button data-tab="tasks">Tareas <span class="badge" id="b-open"></span></button>
      <button data-tab="accounts">Cuentas</button>
      <button data-tab="config">Configuración</button>
    </nav>
    <div class="who"><span id="chip-over" class="chip over" hidden></span><span id="chip-soon" class="chip soon" hidden></span>
      <button class="btn theme" id="btn-theme" title="Cambiar modo claro/oscuro" aria-label="Cambiar modo claro/oscuro">🌙</button><span id="who-user" class="muted"></span><button class="btn" id="btn-out">Salir</button></div>
  </header>
  <main id="view"></main>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toasts"></div>

<script src="config.js"></script>
<script>
window.addEventListener('error', function(e){ var m = document.getElementById('boot-msg'); if(m && !window.__mlBooted){ m.textContent = 'Error al arrancar: ' + e.message + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + '). Revisa que la carpeta js/ y css/ estén subidas.'; } });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
